name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'macOS'
        with:
          version: '6.9.0'
          modules: 'qtshadertools'
          cache: true
      - name: Set up MSYS2/UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-shadertools
            mingw-w64-ucrt-x86_64-libraw
            mingw-w64-ucrt-x86_64-exiv2
            mingw-w64-ucrt-x86_64-lcms2
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        run: cmake --preset macos-debug -DISPVIEW_BUILD_BENCHMARKS=OFF
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: cmake --build --preset macos-debug
      - name: Test (macOS)
        if: runner.os == 'macOS'
        run: ctest --preset macos-debug
      - name: Configure (Windows MSYS2/UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          MSYS2_UCRT64: C:/msys64/ucrt64
        run: cmake --preset windows-msys2-debug -DISPVIEW_BUILD_BENCHMARKS=OFF
      - name: Build (Windows MSYS2/UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cmake --build --preset windows-msys2-debug
      - name: Test (Windows MSYS2/UCRT64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        # The comprehensive Widgets suite is validated on macOS. On hosted Windows runners it
        # uses Qt's headless offscreen plugin, whose window-management limitations make this
        # integration suite flaky; keep the platform-independent and renderer tests here.
        run: ctest --preset windows-msys2-debug -E '^ispview_ui_tests$'
      - name: Require native D3D11 RAW/YUV acceptance
        if: runner.os == 'Windows'
        shell: msys2 {0}
        timeout-minutes: 5
        run: ctest --preset windows-msys2-rhi-acceptance --verbose
