name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            asset_suffix: macos-arm64
          - name: Windows x64
            os: windows-latest
            asset_suffix: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'macOS'
        with:
          version: '6.9.0'
          cache: true

      - name: Set up MSYS2/UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-shadertools
            zip

      - name: Configure and build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --preset macos-release -DISPVIEW_BUILD_BENCHMARKS=OFF
          cmake --build --preset macos-release --parallel

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          app_bundle='build/macos-preset-release/src/ISPImageViewer.app'
          test -d "$app_bundle"
          macdeployqt "$app_bundle" -always-overwrite
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" \
            "dist/ISPImageViewer-${GITHUB_REF_NAME}-${ASSET_SUFFIX}.zip"

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          MSYS2_UCRT64: C:/msys64/ucrt64
        run: |
          cmake --preset windows-msys2-release \
            -DISPVIEW_BUILD_BENCHMARKS=OFF \
            -DISPVIEW_ENABLE_LIBRAW=OFF \
            -DISPVIEW_ENABLE_EXIV2=OFF \
            -DISPVIEW_ENABLE_LCMS2=OFF
          cmake --build --preset windows-msys2-release --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          executable='build/windows-msys2-release/ISPImageViewer.exe'
          test -f "$executable"
          package_directory='dist/ISPImageViewer'
          mkdir -p "$package_directory"
          windeployqt6 --release --compiler-runtime --no-translations --dir "$package_directory" "$executable"
          (
            cd dist
            zip -r "ISPImageViewer-${GITHUB_REF_NAME}-${ASSET_SUFFIX}.zip" ISPImageViewer
          )

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ISPImageViewer-${{ matrix.asset_suffix }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "ISP Image Viewer $GITHUB_REF_NAME" \
            --generate-notes
