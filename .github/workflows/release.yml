name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to package and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-15
            asset_suffix: macos-arm64
          - name: Windows x64
            os: windows-latest
            asset_suffix: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: jurplel/install-qt-action@v4
        if: runner.os == 'macOS'
        with:
          version: '6.9.0'
          # Qt Quick Controls belongs to the qtdeclarative archive; qtsvg is
          # likewise an archive, rather than an install-qt add-on module.
          modules: 'qtshadertools'
          archives: 'qtbase qtdeclarative qtsvg'
          cache: true

      - name: Set up MSYS2/UCRT64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-shadertools
            zip

      - name: Configure and build (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake --preset macos-release -DISPVIEW_BUILD_BENCHMARKS=OFF
          cmake --build --preset macos-release --parallel

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          app_bundle='dist/ISPImageViewer.app'
          test -d "$app_bundle"
          macdeployqt "$app_bundle" -qmldir=src/qml -always-overwrite
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent "$app_bundle" \
            "dist/ISPImageViewer-${RELEASE_TAG}-${ASSET_SUFFIX}.zip"

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          MSYS2_UCRT64: C:/msys64/ucrt64
        run: |
          cmake --preset windows-msys2-release \
            -DISPVIEW_BUILD_BENCHMARKS=OFF \
            -DISPVIEW_ENABLE_LIBRAW=OFF \
            -DISPVIEW_ENABLE_EXIV2=OFF \
            -DISPVIEW_ENABLE_LCMS2=OFF
          cmake --build --preset windows-msys2-release --parallel

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          executable='dist/ISPImageViewer.exe'
          test -f "$executable"
          package_directory='dist/ISPImageViewer'
          mkdir -p "$package_directory"
          cp "$executable" "$package_directory/ISPImageViewer.exe"
          windeployqt6 --release --compiler-runtime --no-translations --qmldir src/qml \
            "$package_directory/ISPImageViewer.exe"
          (
            cd dist
            zip -r "ISPImageViewer-${RELEASE_TAG}-${ASSET_SUFFIX}.zip" ISPImageViewer
          )

      - name: Upload release asset
        uses: actions/upload-artifact@v4
        with:
          name: ISPImageViewer-${{ matrix.asset_suffix }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip \
              --repo "$GITHUB_REPOSITORY" \
              --title "ISP Image Viewer $RELEASE_TAG" \
              --generate-notes
          fi
